{{- $id := printf "install-%d" .Ordinal -}}
<div class="install">
  {{- range $i, $o := site.Params.install }}
  <input type="radio" name="{{ $id }}" id="{{ $id }}-{{ $i }}" class="install-tab-input"{{ if eq $i 0 }} checked{{ end }}>
  {{- end }}
  <div class="install-tabs">
    {{- range $i, $o := site.Params.install }}
    <label for="{{ $id }}-{{ $i }}">{{ $o.name }}</label>
    {{- end }}
  </div>
  <div class="install-commands">
  {{- range $i, $o := site.Params.install }}
  <div class="install-command">
    <pre><code>{{ $o.command }}</code></pre>
    <button type="button" class="install-copy" aria-label="Copy to clipboard" title="Copy" data-copy="{{ $o.command }}"><span>
      <svg class="icon-copy" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      <svg class="icon-done" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
    </span></button>
  </div>
  {{- end }}
  </div>
</div>
