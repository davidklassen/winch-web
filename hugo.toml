baseURL = 'https://winchstack.app/'
title = 'winch'
disableKinds = ['taxonomy', 'term', 'rss']

[module]
[[module.imports]]
path = 'github.com/alex-shpak/hugo-book'

[outputFormats.llms]
mediaType = 'text/plain'
baseName = 'llms'
isPlainText = true
root = true

[outputFormats.markdown]
mediaType = 'text/markdown'
baseName = 'index'
isPlainText = true

[outputs]
home = ['html', 'llms']
page = ['html', 'markdown']
section = ['html', 'markdown']

[mediaTypes.'text/markdown']
suffixes = ['md']

[markup.highlight]
noClasses = false

[markup.goldmark.renderer]
unsafe = true

[markup.goldmark.extensions.typographer]
disable = true

[params]
BookTheme = 'mote-auto'
BookSection = 'docs'
BookSearch = true
BookComments = false
BookToC = true
BookRepo = 'https://github.com/davidklassen/winch'
install = 'curl -fsSL https://winchstack.app/install.sh | sh'

[[menu.after]]
name = 'GitHub'
url = 'https://github.com/davidklassen/winch'
weight = 10
